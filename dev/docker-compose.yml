version: "3.8"
services:
  kafka:
    image: apache/kafka:4.0.0@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
    hostname: kafka
    container_name: kafka
    ports:
      - "19092:9092"
      - "19101:9101"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://localhost:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "pW0o31_zTWqplLKY9UDTQg"
    volumes:
      - ./data/kafka_addins:/tmp/kafka_addins:ro
    healthcheck:
      test: nc -z kafka 29092 || exit -1
      start_period: 180s
      interval: 5s
      timeout: 10s
      retries: 5

  kafka-topic-init:
    image: 'apache/kafka:4.0.0@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75'
    restart: no
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      INIT_KAFKA_BOOTSTRAP_SERVER: "kafka:29092"
    command: [ '/opt/init.sh' ]
    volumes:
      - ./config/kafka_init/init.sh:/opt/init.sh:ro

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.1
    ports:
      - "18080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  mongo:
    image: mongo:7.0.5-jammy
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: "aki-test-db"
      TZ: "Europe/Berlin"


