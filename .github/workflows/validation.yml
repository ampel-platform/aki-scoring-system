name: CI (Tools - Validation)

on:
  push:
    branches: [ "**" ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+**" ]
    paths: [ "tools/validation" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - uses: s4u/maven-settings-action@v3.0.0
        with:
          servers: |
            [{"id": "ampel", "username": "${{ github.actor }}", "password": "${{ secrets.AMPEL_CDSS_ORG_PRIVATE_PACKAGE_ACCESS_TOKEN }}"}]

      - name: Build
        run: mvn --batch-mode --update-snapshots compile

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [ "build" ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - uses: s4u/maven-settings-action@v3.0.0
        with:
          servers: |
            [{"id": "ampel", "username": "${{ github.actor }}", "password": "${{ secrets.AMPEL_CDSS_ORG_PRIVATE_PACKAGE_ACCESS_TOKEN }}"}]

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Release Info Preparation
        id: release-prep
        run: |
          echo "REPOSITORY=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')-validation" >> "$GITHUB_OUTPUT"
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build Tool
        run: mvn package

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.release-prep.outputs.REPOSITORY }}:${{ steps.release-prep.outputs.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ./docker/Dockerfile
          push: true
